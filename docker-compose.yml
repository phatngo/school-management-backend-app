version: '3.8'

services:
  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: school_management_db
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      # Mount the SQL initialization script
      - ./db.sql:/docker-entrypoint-initdb.d/init.sql
      # Persist MySQL data
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - school_network

  # Node.js Application Service
  app:
    build: .
    container_name: school_management_app
    env_file:
      - .env
    environment:
      DB_HOST: db  # Override localhost from .env for Docker
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      NODE_ENV: ${NODE_ENV}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Optional: mount source code for development
      - .:/app
      - /app/node_modules
    networks:
      - school_network
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local

networks:
  school_network:
    driver: bridge
